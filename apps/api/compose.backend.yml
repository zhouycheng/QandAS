name: qanda-backend
services:
  api:
    image: ${BACKEND_IMAGE:-qanda-backend:dev}
    build: .
    env_file: ${BACKEND_ENV_FILE:-.env.backend}
    dns: ["223.5.5.5", "1.1.1.1"]
    environment: &backend_environment
      BACKEND_BIND_ADDRESS: 0.0.0.0
      BACKEND_API_PORT: 8083
      BACKEND_LOCAL_CONTAINER: "true"
      BACKEND_DB_URL: jdbc:postgresql://postgres:5432/qanda_backend
      BACKEND_CAPTURE_SMTP_HOST: mailpit
      BACKEND_CAPTURE_SMTP_PORT: 1025
      BACKEND_FILE_ROOT: /var/lib/qanda/assets
      BACKEND_DOCS_ENABLED: "true"
      BACKEND_ROLE: api
      BACKEND_RABBIT_HOST: rabbitmq
      BACKEND_RABBIT_PASSWORD: ${BACKEND_RABBIT_PASSWORD:?configure a private queue password}
      TENCENT_SECRET_ID: ${TENCENT_SECRET_ID:-}
      TENCENT_SECRET_KEY: ${TENCENT_SECRET_KEY:-}
      TENCENT_SES_REGION: ${TENCENT_SES_REGION:-}
      TENCENT_SES_FROM_EMAIL: ${TENCENT_SES_FROM_EMAIL:-}
      TENCENT_SES_VERIFICATION_TEMPLATE_ID: ${TENCENT_SES_VERIFICATION_TEMPLATE_ID:-}
    expose: [8083, 9091]
    volumes: ["backend_assets:/var/lib/qanda/assets"]
    depends_on:
      postgres:
        condition: service_healthy
      mailpit:
        condition: service_started
    restart: unless-stopped
    mem_limit: 768m
    stop_grace_period: 30s
  worker:
    image: ${BACKEND_IMAGE:-qanda-backend:dev}
    env_file: ${BACKEND_ENV_FILE:-.env.backend}
    dns: ["223.5.5.5", "1.1.1.1"]
    environment:
      <<: *backend_environment
      BACKEND_ROLE: worker
      BACKEND_WORKER_ENABLED: "true"
      BACKEND_DOCS_ENABLED: "false"
      BACKEND_DB_POOL_SIZE: 6
    volumes: ["backend_assets:/var/lib/qanda/assets"]
    depends_on:
      postgres: {condition: service_healthy}
      rabbitmq: {condition: service_healthy}
    restart: unless-stopped
    mem_limit: 768m
    stop_grace_period: 30s
  monitor:
    image: ${BACKEND_IMAGE:-qanda-backend:dev}
    env_file: ${BACKEND_ENV_FILE:-.env.backend}
    environment:
      <<: *backend_environment
      BACKEND_ROLE: monitor
      BACKEND_MONITORING_ENABLED: "true"
      BACKEND_DOCS_ENABLED: "false"
      BACKEND_DB_POOL_SIZE: 2
      BACKEND_DB_QUERY_TIMEOUT: 3
      BACKEND_DB_SESSION_INIT: SET TIME ZONE 'UTC'; SET ROLE qanda_monitor; SET statement_timeout='3s'
      BACKEND_PROMETHEUS_URL: http://prometheus:9090
    depends_on:
      postgres: {condition: service_healthy}
    restart: unless-stopped
    mem_limit: 512m
  gateway:
    image: nginx:1.28-alpine
    ports: ["127.0.0.1:${BACKEND_API_PORT:-8083}:8083"]
    volumes: ["./monitoring/gateway.conf:/etc/nginx/conf.d/default.conf:ro"]
    depends_on: [api, monitor]
    restart: unless-stopped
  rabbitmq:
    image: rabbitmq:4.2.5-management
    environment:
      RABBITMQ_DEFAULT_USER: qanda
      RABBITMQ_DEFAULT_PASS: ${BACKEND_RABBIT_PASSWORD:?configure a private queue password}
    volumes:
      - backend_rabbit:/var/lib/rabbitmq
      - ./monitoring/rabbitmq-plugins:/etc/rabbitmq/enabled_plugins:ro
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 30
    restart: unless-stopped
  prometheus:
    image: prom/prometheus:v3.5.0
    command: ["--config.file=/etc/prometheus/prometheus.yml", "--storage.tsdb.retention.time=15d"]
    volumes:
      - backend_metrics:/prometheus
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/sync-rules.yml:/etc/prometheus/sync-rules.yml:ro
    restart: unless-stopped
  postgres:
    image: postgres:17.6-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: qanda_backend
      POSTGRES_USER: qanda_backend
      POSTGRES_PASSWORD: ${BACKEND_DB_PASSWORD:?run backend.mjs init}
      TZ: UTC
      PGTZ: UTC
    ports: ["127.0.0.1:${BACKEND_DB_PORT:-56432}:5432"]
    volumes:
      - backend_pg:/var/lib/postgresql/data
      - ./src/main/resources/db/schema.sql:/docker-entrypoint-initdb.d/001-schema.sql:ro
      - ./src/main/resources/db/monitoring-permissions.sql:/docker-entrypoint-initdb.d/002-monitoring-permissions.sql:ro
      - ./src/main/resources/db/migration/V2__ProfileSetupAndBankVisibility.sql:/docker-entrypoint-initdb.d/003-profile-setup.sql:ro
      - ./src/main/resources/db/migration/V3__TestAccounts.sql:/docker-entrypoint-initdb.d/004-test-accounts.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U qanda_backend -d qanda_backend"]
      interval: 2s
      timeout: 2s
      retries: 30
  mailpit:
    image: axllent/mailpit:v1.32.0
    restart: unless-stopped
    ports: ["127.0.0.1:${BACKEND_SMTP_PORT:-51025}:1025", "127.0.0.1:${BACKEND_MAIL_UI_PORT:-58025}:8025"]
volumes:
  backend_pg:
  backend_assets:
  backend_rabbit:
  backend_metrics:
