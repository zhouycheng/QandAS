server:
  address: ${BACKEND_BIND_ADDRESS:127.0.0.1}
  port: ${BACKEND_API_PORT:8083}
  forward-headers-strategy: none
  max-http-request-header-size: 16KB
  compression:
    enabled: true
    min-response-size: 2KB
  error:
    include-message: never
    include-stacktrace: never
spring:
  flyway:
    enabled: false
  lifecycle:
    timeout-per-shutdown-phase: 90s
  application:
    name: qanda-backend
  rabbitmq:
    host: ${BACKEND_RABBIT_HOST:127.0.0.1}
    port: ${BACKEND_RABBIT_PORT:5672}
    username: ${BACKEND_RABBIT_USER:qanda}
    password: ${BACKEND_RABBIT_PASSWORD:}
    publisher-confirm-type: correlated
    publisher-returns: true
    connection-timeout: 3s
    listener:
      simple:
        prefetch: 1
        missing-queues-fatal: false
  task:
    scheduling:
      pool:
        size: 4
  datasource:
    url: ${BACKEND_DB_URL:jdbc:postgresql://127.0.0.1:56432/qanda_backend}
    username: ${BACKEND_DB_USER:qanda_backend}
    password: ${BACKEND_DB_PASSWORD}
    hikari:
      maximum-pool-size: ${BACKEND_DB_POOL_SIZE:8}
      connection-timeout: 5000
      transaction-isolation: TRANSACTION_READ_COMMITTED
      connection-init-sql: ${BACKEND_DB_SESSION_INIT:SET TIME ZONE 'UTC'}
  sql:
    init:
      mode: never
  jdbc:
    template:
      query-timeout: ${BACKEND_DB_QUERY_TIMEOUT:5}s
  jackson:
    time-zone: UTC
    serialization:
      write-dates-as-timestamps: false
  servlet:
    multipart:
      max-file-size: 8MB
      max-request-size: 8MB
qanda:
  backend:
    role: ${BACKEND_ROLE:api}
    worker-enabled: ${BACKEND_WORKER_ENABLED:false}
    monitoring-enabled: ${BACKEND_MONITORING_ENABLED:false}
    prometheus-url: ${BACKEND_PROMETHEUS_URL:http://127.0.0.1:9090}
    mode: ${BACKEND_MODE:production}
    max-concurrent-requests: ${BACKEND_MAX_CONCURRENT_REQUESTS:32}
    request-limits:
      enabled: ${BACKEND_REQUEST_LIMITS_ENABLED:true}
      window-seconds: ${BACKEND_REQUEST_LIMIT_WINDOW_SECONDS:60}
      anonymous-per-peer: ${BACKEND_REQUEST_LIMIT_ANONYMOUS_PER_PEER:60000}
      max-keys: ${BACKEND_REQUEST_LIMIT_MAX_KEYS:100000}
    mail:
      enabled: ${BACKEND_MAIL_ENABLED:false}
      transport: ${BACKEND_MAIL_TRANSPORT:unconfigured}
      host: ${BACKEND_CAPTURE_SMTP_HOST:127.0.0.1}
      port: ${BACKEND_CAPTURE_SMTP_PORT:51025}
      dispatch-enabled: ${BACKEND_MAIL_DISPATCH_ENABLED:true}
    files:
      enabled: ${BACKEND_FILES_ENABLED:false}
      root: ${BACKEND_FILE_ROOT:${user.home}/.local/share/qanda-backend/assets}

management:
  endpoint:
    health:
      probes:
        enabled: true
      group:
        readiness:
          include: readinessState,deployment
  server:
    port: ${BACKEND_METRICS_PORT:9091}
  endpoints:
    web:
      exposure:
        include: health,prometheus
  metrics:
    web:
      server:
        max-uri-tags: 256
    tags:
      application: qanda
      role: ${BACKEND_ROLE:api}
    distribution:
      percentiles-histogram:
        http.server.requests: true

mybatis-plus:
  mapper-locations: classpath*:mapper/**/*.xml
  type-handlers-package: qanda.backend.platform.persistence
  configuration:
    map-underscore-to-camel-case: true
    jdbc-type-for-null: 'NULL'
    default-statement-timeout: 10
  global-config:
    banner: false
springdoc:
  api-docs:
    enabled: ${BACKEND_DOCS_ENABLED:false}
    version: OPENAPI_3_1
  swagger-ui:
    enabled: ${BACKEND_DOCS_ENABLED:false}
