name: Deploy admin
on:
  workflow_dispatch:
    inputs:
      operation:
        description: Check connectivity, deploy main, or roll back this node
        type: choice
        options: [check, deploy, rollback]
        default: deploy
permissions: {}
concurrency:
  group: qanda-production-frontend
  cancel-in-progress: false
jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
      - name: Require the main branch
        env:
          SOURCE_REF: ${{ github.ref }}
        run: test "$SOURCE_REF" = refs/heads/main
  verify:
    needs: guard
    if: inputs.operation == 'deploy'
    permissions:
      contents: read
    uses: ./.github/workflows/ci.yml
    with:
      scope: frontend
  deploy:
    needs: [guard, verify]
    if: ${{ !cancelled() && needs.guard.result == 'success' && (inputs.operation == 'check' || inputs.operation == 'rollback' || needs.verify.result == 'success') }}
    runs-on: ubuntu-latest
    timeout-minutes: 75
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Check this owner's deployment identity
        env:
          TS_CLIENT: ${{ secrets.FRONTEND_TS_OAUTH_CLIENT_ID }}
          TS_AUDIENCE: ${{ secrets.FRONTEND_TS_AUDIENCE }}
          SSH_KEY: ${{ secrets.FRONTEND_DEPLOY_SSH_KEY }}
          SSH_HOSTS: ${{ secrets.FRONTEND_DEPLOY_SSH_KNOWN_HOSTS }}
        run: test -n "$TS_CLIENT" && test -n "$TS_AUDIENCE" && test -n "$SSH_KEY" && test -n "$SSH_HOSTS"
      - uses: tailscale/github-action@780049a30b6ff5c378a9e7b389d15ece7a204888 # v4.1.3
        with:
          oauth-client-id: ${{ secrets.FRONTEND_TS_OAUTH_CLIENT_ID }}
          audience: ${{ secrets.FRONTEND_TS_AUDIENCE }}
          tags: tag:qanda-ci
      - name: Deploy and verify frontend
        env:
          OPERATION: ${{ inputs.operation }}
          SOURCE_TOKEN: ${{ github.token }}
          SOURCE_BUILD: "true"
          OPERATION_ID: ${{ github.run_id }}-${{ github.run_attempt }}-frontend
          DEPLOY_TARGETS: ${{ secrets.DEPLOY_TARGETS }}
          DEPLOY_NODE: frontend
          DEPLOY_SSH_KEY: ${{ secrets.FRONTEND_DEPLOY_SSH_KEY }}
          DEPLOY_SSH_KNOWN_HOSTS: ${{ secrets.FRONTEND_DEPLOY_SSH_KNOWN_HOSTS }}
        run: python3 deploy/dispatch.py
