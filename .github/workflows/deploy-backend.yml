name: Deploy backend
on:
  workflow_dispatch:
    inputs:
      operation:
        description: Check connectivity, deploy main, or roll back this node
        type: choice
        options: [check, deploy, rollback]
        default: deploy
permissions: {}
concurrency:
  group: qanda-production-backend
  cancel-in-progress: false
jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
      - name: Require the main branch
        env:
          SOURCE_REF: ${{ github.ref }}
        run: test "$SOURCE_REF" = refs/heads/main
  verify:
    needs: guard
    if: inputs.operation == 'deploy'
    permissions:
      contents: read
    uses: ./.github/workflows/ci.yml
    with:
      scope: backend
  publish:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.image.outputs.image }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5
        id: verified
        with:
          path: release/
          key: ${{ needs.verify.outputs.release-cache-key }}
          fail-on-cache-miss: true
      - name: Publish the verified backend image
        id: image
        env:
          RELEASE_KIND: backend
          CACHE_EXACT_HIT: ${{ steps.verified.outputs.cache-hit }}
          REGISTRY_TOKEN: ${{ github.token }}
        run: bash deploy/publish-image.sh
  deploy:
    needs: [guard, verify, publish]
    if: ${{ !cancelled() && needs.guard.result == 'success' && (inputs.operation == 'check' || inputs.operation == 'rollback' || needs.publish.result == 'success') }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      id-token: write
      packages: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Check this owner's deployment identity
        env:
          TS_CLIENT: ${{ secrets.BACKEND_TS_OAUTH_CLIENT_ID }}
          TS_AUDIENCE: ${{ secrets.BACKEND_TS_AUDIENCE }}
          SSH_KEY: ${{ secrets.BACKEND_DEPLOY_SSH_KEY }}
          SSH_HOSTS: ${{ secrets.BACKEND_DEPLOY_SSH_KNOWN_HOSTS }}
        run: test -n "$TS_CLIENT" && test -n "$TS_AUDIENCE" && test -n "$SSH_KEY" && test -n "$SSH_HOSTS"
      - name: Prepare the immutable image for transfer
        id: archive
        if: inputs.operation == 'deploy'
        env:
          IMAGE_KIND: backend
          IMAGE: ${{ needs.publish.outputs.image }}
          REGISTRY_TOKEN: ${{ github.token }}
          GITHUB_ACTOR: ${{ github.actor }}
        run: bash deploy/prepare-image-transfer.sh
      - uses: tailscale/github-action@780049a30b6ff5c378a9e7b389d15ece7a204888 # v4.1.3
        with:
          oauth-client-id: ${{ secrets.BACKEND_TS_OAUTH_CLIENT_ID }}
          audience: ${{ secrets.BACKEND_TS_AUDIENCE }}
          tags: tag:qanda-ci
      - name: Deploy and verify backend
        env:
          OPERATION: ${{ inputs.operation }}
          BACKEND: ${{ needs.publish.outputs.image }}
          IMAGE_ARCHIVE: ${{ runner.temp }}/qanda-image.tar
          IMAGE_ARCHIVE_SHA256: ${{ steps.archive.outputs.sha256 }}
          REGISTRY_TOKEN: ${{ github.token }}
          DEPLOY_TARGETS: ${{ secrets.DEPLOY_TARGETS }}
          DEPLOY_NODE: backend
          DEPLOY_SSH_KEY: ${{ secrets.BACKEND_DEPLOY_SSH_KEY }}
          DEPLOY_SSH_KNOWN_HOSTS: ${{ secrets.BACKEND_DEPLOY_SSH_KNOWN_HOSTS }}
        run: python3 deploy/dispatch.py
