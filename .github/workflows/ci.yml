name: CI
on:
  pull_request:
  push:
    branches: [main]
  workflow_call:
    inputs:
      scope:
        type: string
        default: all
        description: Verify all clients or one deployment node (backend or frontend)
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
      - uses: pnpm/action-setup@d9184bf108216479bc5a137cc391f4d7b14c870b # v6.1.0
        with:
          version: '11.25.0'
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        if: inputs.scope != 'frontend'
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: apps/api/pom.xml
      - name: Verify deployment scripts
        env:
          BUILD_SCOPE: ${{ inputs.scope || 'all' }}
        run: |
          case "$BUILD_SCOPE" in all|backend|frontend) ;; *) exit 1 ;; esac
          python3 -m unittest discover -s deploy/tests -v
          python3 -m unittest discover -s apps/api/scripts -p '*_test.py' -v
          python3 -m unittest discover -s apps/api/capacity -p 'test_*.py' -v
          node --check apps/api/capacity/load.js
      - name: Verify shared content and admin
        if: inputs.scope != 'backend'
        run: |
          npm --prefix packages/content-format ci
          npm --prefix packages/content-format test
          pnpm --dir apps/admin install --frozen-lockfile
          pnpm --dir apps/admin test
          pnpm --dir apps/admin build
      - name: Verify mini program logic
        if: inputs.scope != 'backend' && inputs.scope != 'frontend'
        run: |
          npm --prefix apps/miniapp ci
          npm --prefix apps/miniapp test | tee "$RUNNER_TEMP/miniapp.log"
          if grep -q 'SKIP' "$RUNNER_TEMP/miniapp.log"; then
            echo '::notice::Official WeChat compiler checks were skipped; native compilation is a separate verification.'
          fi
      - name: Verify backend and package the tested JAR
        if: inputs.scope != 'frontend'
        run: |
          npm --prefix packages/content-format ci
          npm --prefix packages/content-format run build
          npm --prefix apps/miniapp ci
          python3 -m pip install -r apps/api/acceptance/requirements-qa.txt
          node apps/api/scripts/backend.mjs init
          node apps/api/scripts/backend.mjs verify
          sudo python3 deploy/tests/db_admin_integration.py
      - name: Verify the packaged backend image
        if: inputs.scope != 'frontend'
        run: |
          docker build -t qanda-backend-ci:${{ github.sha }} apps/api
          python3 deploy/candidate-check.py qanda-backend-ci:${{ github.sha }}
      - name: Verify container network isolation
        run: |
          docker pull nginx:1.28-alpine
          sudo python3 deploy/tests/tailnet_integration.py
          if ! test -x /usr/sbin/sshd; then
            sudo apt-get update -qq
            sudo apt-get install -y --no-install-recommends openssh-server
          fi
          sudo python3 deploy/tests/operations_integration.py
      - name: Create verified artifact manifest
        if: github.event_name == 'workflow_dispatch' && inputs.scope != 'frontend' && vars.QANDA_PREPARE_INFRA == 'true'
        env:
          BUILD_SCOPE: ${{ inputs.scope || 'all' }}
        run: |
          mkdir -p release/backend release/web
          if test "$BUILD_SCOPE" != frontend; then cp apps/api/target/qanda-backend-1.0.0.jar release/backend/; fi
          if test "$BUILD_SCOPE" != backend; then cp -R apps/admin/dist/. release/web/; fi
          cd release
          find backend web -type f -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS
      - name: Prepare offline infrastructure images
        if: github.event_name == 'workflow_dispatch' && inputs.scope != 'frontend' && vars.QANDA_PREPARE_INFRA == 'true'
        run: |
          set -euo pipefail
          images=(postgres:17.6-alpine rabbitmq:4.2.5-management redis:8.10.3-alpine prom/prometheus:v3.5.0 nginx:1.28-alpine)
          for image in "${images[@]}"; do docker pull --platform linux/amd64 "$image"; done
          docker save "${images[@]}" | gzip -1 > release/infrastructure.tar.gz
          cd release
          sha256sum infrastructure.tar.gz >> SHA256SUMS
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: github.event_name == 'workflow_dispatch' && inputs.scope != 'frontend' && vars.QANDA_PREPARE_INFRA == 'true'
        with:
          name: verified-release-${{ github.sha }}
          path: release/
          if-no-files-found: error
          retention-days: 3
