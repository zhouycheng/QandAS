<h1>题小搭后端容量实测</h1>
<p class="status" id="status"></p>
<p class="note">测试链路：Mac 原生 k6 → 私有 SSH 隧道 → 新后端。蓝色开启限流，橙色关闭限流；实心点为当次通过，空心点为当次未通过。成功吞吐排除 429、服务端和网络失败。</p>

const data=evidence.trials,series=evidence.series;
const names={journey:'真实学生使用（活跃用户）',read:'题库读取（目标操作/秒）',create:'创建练习（目标操作/秒）',sync:'答案同步（目标操作/秒）',finish:'创建并交卷（目标操作/秒）',burst_create:'集中打开练习（一秒内用户数）',burst_finish:'集中交卷（一秒内用户数）'};
const metrics={successful_rps:'成功 HTTP 请求/秒',http_rps:'全部 HTTP 请求/秒',http_p95_ms:'HTTP P95（毫秒）',commit_p95_ms:'最终落库 P95（毫秒）',host_cpu_percent:'主机 CPU（%）',available_mib:'主机可用内存（MiB）',swap_mib:'主机 Swap（MiB）',network_tx_mbps:'主机外网发送（Mbit/秒）',api_cpu_cores:'API CPU（核）',worker_cpu_cores:'Worker CPU（核）',monitor_cpu_cores:'Monitor CPU（核）',api_memory_mib:'API 容器内存（MiB）',worker_memory_mib:'Worker 容器内存（MiB）',postgres_memory_mib:'PostgreSQL 容器内存（MiB）',rabbitmq_memory_mib:'RabbitMQ 容器内存（MiB）',api_heap_mib:'API JVM 堆（MiB）',api_gc_pause_percent:'API GC 暂停时间（%）',api_http_inflight:'API 同时处理请求数',api_overload_rejections:'API 拥挤拒绝累计次数',api_http_busy_threads:'API 忙碌 HTTP 线程数',tunnel_cpu_percent:'隧道 CPU（占单核 %）',tunnel_rss_mib:'隧道内存（MiB）',api_pool_pending:'API 连接池等待数',api_pool_acquire_max_ms:'API 连接获取最大时间（毫秒）',postgres_connections:'PostgreSQL 连接数',postgres_lock_waits:'PostgreSQL 锁等待数',progress_queue:'答案队列未完成消息数',queue_published_per_second:'答案消息入队/秒',queue_acked_per_second:'答案消息确认/秒',activity_pending:'统计待处理事件数',activity_oldest_seconds:'统计最老事件等待（秒）',generator_cpu_percent:'发压进程 CPU（占全机 %）',generator_rss_mib:'发压进程内存（MiB）'};
Object.assign(metrics,{api_http_queued:'API 排队请求数',api_queue_wait_max_ms:'API 排队最大等待（毫秒）',api_cache_hit_percent:'API 缓存条目命中率（%）',api_cache_bypass_per_second:'API 缓存回源条目/秒',api_cache_failures_per_second:'API 缓存故障/秒',redis_memory_mib:'Redis 容器内存（MiB）',redis_cpu_cores:'Redis CPU（核）',redis_data_memory_mib:'Redis 已用内存（MiB）',redis_clients:'Redis 连接数',redis_hit_percent:'Redis 条目命中率（%）',redis_evictions_per_second:'Redis 淘汰条目/秒'});
metrics.commit_p95_ms='保存确认 P95（毫秒）';
const $=id=>document.getElementById(id),fmt=x=>x==null?'—':Number(x).toFixed(2);
function option(select,value,text){const o=document.createElement('option');o.value=value;o.textContent=text;select.append(o)}
$('status').textContent=evidence.complete?'整套场景已执行完成。稳定容量、失稳和停止原因请结合报告判断。':'测试尚未全部完成，当前图表仅展示已经完成的运行。';
for(const s of [...new Set(data.map(x=>x.scenario))])option($('scenario'),s,names[s]||s);
for(const [key,label] of Object.entries(metrics))option($('metric'),key,label);
function axes(mx,my,xlabel,ylabel){let out='<path d="M80 25V360H1030" fill="none" stroke="#66778c"/>';
 for(let i=0;i<=5;i++){const y=360-i*65,x=80+i*186;out+=`<text x="69" y="${y+5}" text-anchor="end" font-size="13">${fmt(my*i/5)}</text><path d="M80 ${y}H1030" stroke="#e7edf5"/><text x="${x}" y="385" text-anchor="middle" font-size="13">${fmt(mx*i/5)}</text>`}
 return out+`<text x="555" y="420" text-anchor="middle" font-size="14">${xlabel}</text><text x="20" y="195" transform="rotate(-90 20 195)" text-anchor="middle" font-size="14">${ylabel}</text>`}
function render(){const rows=data.filter(x=>x.scenario===$('scenario').value),mx=Math.max(1,...rows.map(x=>x.target)),my=Math.max(1,...rows.map(x=>x.successful_rps||0));let s=axes(mx,my,'目标档位','成功 HTTP RPS');
 for(const r of rows){const color=r.limits==='on'?'#2464d7':'#dc781c';s+=`<circle cx="${80+r.target/mx*930}" cy="${360-(r.successful_rps||0)/my*325}" r="5" fill="${r.stable?color:'white'}" stroke="${color}" stroke-width="2"><title>${r.label}: ${fmt(r.successful_rps)} RPS，${r.stable?'通过':'未通过'}</title></circle>`}
 $('plot').innerHTML=s;$('rows').innerHTML=rows.map(r=>`<tr><td>${r.limits==='on'?'开启':'关闭'}</td><td>${r.target}</td><td>${r.achieved_vus_peak==null?'—':r.achieved_vus_peak}</td><td>${fmt(r.successful_rps)}</td><td>${fmt(r.completed_operations_per_second)}</td><td>${fmt(r.p95_ms)}</td><td>${fmt(r.p99_ms)}</td><td>${r.limited||0}</td><td>${r.unavailable==null?'—':r.unavailable} / ${r.timeouts==null?'—':r.timeouts}</td><td>${r.server_errors||0} / ${r.transport_errors||0}</td><td>${r.stable?'通过':'未通过'}</td></tr>`).join('');
 $('trial').replaceChildren();for(const r of rows)option($('trial'),r.label,r.label);trend()}
function trend(){const key=$('metric').value,rows=(series[$('trial').value]||[]).filter(x=>Number.isFinite(x[key])),mx=Math.max(1,...rows.map(x=>x.seconds)),my=Math.max(1,...rows.map(x=>x[key]));let s=axes(mx,my,'运行时间（秒）',metrics[key]);
 s+=`<polyline points="${rows.map(x=>`${80+x.seconds/mx*930},${360-x[key]/my*325}`).join(' ')}" fill="none" stroke="#2464d7" stroke-width="2"/>`;$('trend').innerHTML=s}
