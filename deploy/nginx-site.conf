# Install the TLS certificate before enabling this virtual host.
server {
    listen 80;
    server_name qanda.zhoust.cn;
    location /.well-known/acme-challenge/ { root /var/www/html; }
    location / { return 301 https://$host$request_uri; }
}
server {
    listen 443 ssl;
    server_name qanda.zhoust.cn;
    ssl_certificate /etc/letsencrypt/live/qanda.zhoust.cn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/qanda.zhoust.cn/privkey.pem;
    client_max_body_size 8m;
    location ~ ^/api/v1/content-safety/(media/|wechat-callback$) {
        access_log off;
        proxy_pass http://127.0.0.1:18083;
        proxy_http_version 1.1;
        proxy_set_header Connection '';
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_cache off;
    }
    location / {
        proxy_pass http://127.0.0.1:18083;
        proxy_http_version 1.1;
        proxy_set_header Connection '';
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_buffering off;
        proxy_read_timeout 1h;
    }
}
