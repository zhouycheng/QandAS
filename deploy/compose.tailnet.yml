name: qanda-tailnet
services:
  tailnet:
    image: ${TAILSCALE_IMAGE:?immutable Tailscale image required}
    container_name: qanda-tailnet
    environment:
      TS_HOSTNAME: qanda-${TAILNET_NODE_ROLE:?required}
      TS_STATE_DIR: /var/lib/tailscale
      TS_AUTH_ONCE: "true"
      TS_BOOT_TIMEOUT: 30m
      TS_USERSPACE: "false"
      TS_ACCEPT_DNS: "false"
      TS_EXTRA_ARGS: ${TAILNET_TAG_ARGS:-} --accept-routes=false --ssh=false
      TS_ENABLE_HEALTH_CHECK: "true"
      TS_LOCAL_ADDR_PORT: 127.0.0.1:9002
      TS_SERVE_CONFIG: /config/serve.json
    cap_drop: [ALL]
    cap_add: [NET_ADMIN, NET_RAW]
    devices: [/dev/net/tun:/dev/net/tun]
    security_opt: [no-new-privileges:true]
    read_only: true
    tmpfs: [/tmp, /var/run]
    volumes:
      - tailnet-state:/var/lib/tailscale
      - /srv/qanda/tailnet-config:/config:ro
    sysctls:
      net.ipv4.ip_forward: "0"
      net.ipv6.conf.all.forwarding: "0"
    networks:
      application:
        ipv4_address: 172.29.71.20
        aliases: [qanda-tailnet]
    # systemd starts this only after the host isolation rules have been verified.
    restart: "no"
    mem_limit: 128m
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, http://127.0.0.1:9002/healthz]
      start_period: 30m
      interval: 10s
      timeout: 3s
      retries: 6
  gateway:
    image: ${GATEWAY_IMAGE:?immutable gateway image required}
    network_mode: service:tailnet
    depends_on:
      tailnet:
        condition: service_healthy
        restart: true
    user: "101:101"
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    read_only: true
    tmpfs:
      - /etc/nginx/conf.d:uid=101,gid=101,mode=0755
      - /var/cache/nginx:uid=101,gid=101,mode=0755
      - /var/run:uid=101,gid=101,mode=0755
    environment:
      TAILNET_API_UPSTREAM: ${TAILNET_API_UPSTREAM:?required}
      TAILNET_MONITOR_UPSTREAM: ${TAILNET_MONITOR_UPSTREAM:?required}
      TAILNET_ALLOWED_CLIENT: ${TAILNET_ALLOWED_CLIENT:?required}
    volumes:
      - /srv/qanda/tailnet-${TAILNET_NODE_ROLE}.conf:/etc/nginx/templates/default.conf.template:ro
    restart: "no"
    mem_limit: 32m
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, http://127.0.0.1:8080/healthz]
      interval: 5s
      timeout: 3s
      retries: 12
networks:
  application:
    external: true
    name: qanda-application
volumes:
  tailnet-state:
    name: qanda-project-tailnet
