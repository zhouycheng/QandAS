AddressFamily inet
ListenAddress 172.29.71.1
Port 2203
HostKey /etc/qanda/ssh_host_ed25519_key
PidFile /run/qanda-sshd.pid
AllowUsers qanda-deploy qanda-debug
AuthorizedKeysFile /etc/ssh/qanda-authorized-keys/%u
AuthenticationMethods publickey
PubkeyAuthentication yes
PasswordAuthentication no
KbdInteractiveAuthentication no
PermitRootLogin no
UsePAM yes
DisableForwarding yes
PermitTunnel no
PermitUserEnvironment no
PermitUserRC no
X11Forwarding no
PrintMotd no
PrintLastLog no
ForceCommand /usr/local/lib/qanda/remote-entry.py
Match User qanda-deploy
    PermitTTY no
Match User qanda-debug
    PermitTTY yes
