server {
    listen 8080;
    resolver 127.0.0.11 valid=5s;
    root /usr/share/nginx/html;
    client_max_body_size 8m;
    set $api ${QANDA_API_UPSTREAM};
    set $monitor ${QANDA_MONITOR_UPSTREAM};
    location = /healthz { access_log off; return 200 'ok'; }
    location /actuator { return 404; }
    location /assets/ {
        root /srv/qanda-assets;
        add_header Cache-Control 'public, max-age=31536000, immutable';
        try_files $uri =404;
    }
    location ~ ^/api/v1/admin/(monitoring/|statistics/(activity|rankings|online-users)$) {
        proxy_pass $monitor$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Connection '';
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $http_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
    }
    location /api/v1/ {
        proxy_pass $api$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Connection '';
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $http_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 90s;
    }
    location / {
        add_header Cache-Control 'no-cache';
        try_files $uri $uri/ /index.html;
    }
}
