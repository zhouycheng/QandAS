map "${QANDA_GATEWAY_KEY}|${QANDA_API_UPSTREAM}|${QANDA_MONITOR_UPSTREAM}" $qanda_business_ready {
    default 0;
    "~^[|]" 1;
    "~^[^|]+[|]https://[^|]+[|]https://" 1;
}
server {
    listen 8080;
    resolver 127.0.0.11 valid=5s;
    root /usr/share/nginx/html;
    client_max_body_size 8m;
    set $api ${QANDA_API_UPSTREAM};
    set $monitor ${QANDA_MONITOR_UPSTREAM};
    proxy_ssl_server_name on;
    proxy_ssl_verify on;
    proxy_ssl_trusted_certificate /etc/ssl/cert.pem;
    proxy_ssl_verify_depth 3;
    location = /healthz { access_log off; return 200 'ok'; }
    location /actuator { return 404; }
    location = /api/v1/health {
        proxy_pass $api/api/v1/health;
        proxy_pass_request_headers off;
        proxy_pass_request_body off;
        proxy_set_header Content-Length '';
        proxy_http_version 1.1;
        proxy_set_header Connection '';
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $http_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Qanda-Gateway-Key '';
    }
    location /assets/ {
        root /srv/qanda-assets;
        add_header Cache-Control 'public, max-age=31536000, immutable';
        try_files $uri =404;
    }
    location ~ ^/api/v1/admin/(monitoring/|statistics/(activity|rankings|online-users)$) {
        if ($qanda_business_ready = 0) { return 503; }
        proxy_pass $monitor$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Connection '';
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $http_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Qanda-Gateway-Key '${QANDA_GATEWAY_KEY}';
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
    }
    location /api/v1/ {
        if ($qanda_business_ready = 0) { return 503; }
        proxy_pass $api$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Connection '';
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $http_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Qanda-Gateway-Key '${QANDA_GATEWAY_KEY}';
        proxy_read_timeout 90s;
    }
    location / {
        add_header Cache-Control 'no-cache';
        try_files $uri $uri/ /index.html;
    }
}
