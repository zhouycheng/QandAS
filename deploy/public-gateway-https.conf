# Enable this template after installing the backend certificate and private key.
server {
    listen 8443 ssl;
    ssl_certificate /etc/qanda/tls/fullchain.pem;
    ssl_certificate_key /etc/qanda/tls/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    include /etc/nginx/conf.d/gateway-routes.inc;
}
