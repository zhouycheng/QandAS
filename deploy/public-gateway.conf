map_hash_bucket_size 128;
map $http_x_qanda_gateway_key $qanda_gateway_authenticated {
    default 0;
    "${QANDA_GATEWAY_KEY}" 1;
}
map "$remote_addr|$qanda_gateway_authenticated" $qanda_client_address {
    default $remote_addr;
    "${QANDA_GATEWAY_ALLOWED_CLIENT}|1" $http_x_forwarded_for;
}
server {
    listen 127.0.0.1:8081;
    access_log off;
    location = /healthz { return 200 'ok'; }
    location / { return 404; }
}
server {
    listen 8080;
    include /etc/nginx/conf.d/gateway-routes.inc;
}
